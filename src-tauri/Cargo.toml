[package]
# 包名即最终可执行文件名（cargo 输出 MasterEdit.exe），与 productName 保持一致，
# 避免安装目录里再出现旧的 mastermd.exe。库名单独用 [lib] 指定为合法标识符。
name = "MasterEdit"
version = "0.18.0"
description = "MasterEdit — Windows Markdown, Office Sheet, PDF & Code Viewer/Editor"
authors = ["bigmasterpang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "masteredit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
notify = "8.2.0"
encoding_rs = "0.8"
calamine = "0.36.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
incremental = false

[dev-dependencies]
rust_xlsxwriter = "0.99.1"
